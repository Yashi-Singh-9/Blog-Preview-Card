<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Blog preview card</title>
</head>
<body>
  <div class="blog-container">
    <img src="images/illustration-article.svg" alt="Illustration">
    <div class="card-content">
      <span class="badge">Learning</span>
      <span class="date">Published 21 Dec 2023</span>
      <h1>HTML & CSS foundations</h1>
      <p>These languages are the backbone of every website, defining structure, content, and presentation.</p>
      <div class="author">
        <img src="images/image-avatar.webp" alt="Greg Hooper Image" class="author-image">
        <span class="author-name">Greg Hooper</span>
      </div>
    </div>
  </div>  
  <footer>
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://www.linkedin.com/in/yashi-singh-b4143a246" target="_blank">Yashi Singh</a>.
  </footer>
</body>
</html>
